<article class="bannier">
  <div class="content">
    <figure><img src="assets/{{ card.game }}" alt="" /></figure>
    <div class="text">
      <div>
        <h3>{{ card.name }}</h3>
        <p class="time">{{ card.description }}</p>
      </div>
      <div>
        <p>{{ card.beginDate}}</p>
        <p>{{ card.numberOfPlayers }}</p>
        <p>{{ card.game }}</p>
        <p>{{ card.format }}</p>
      </div>
    </div>
  </div>
</article>
